version: "3.9"

services:
  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: buimbpay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buimbpay
      POSTGRES_PASSWORD: buimbpay_dev_secret
      POSTGRES_DB: buimbpay_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buimbpay -d buimbpay_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: buimbpay_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass buimbpay_redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "buimbpay_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin ──────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: buimbpay_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@buimbpay.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── RedisInsight ─────────────────────────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: buimbpay_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

  # ─── Mailhog (SMTP trap for dev) ─────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: buimbpay_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    logging:
      driver: none

volumes:
  postgres_data:
  redis_data:
